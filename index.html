<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8f7f1">
<title>Seen & Sheen • Little Letter Garden</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Noto+Naskh+Arabic:wght@500;600;700&display=swap');
:root{--ink:#25483e;--green:#28755b;--cream:#f8f7f1;--orange:#eea447}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'Baloo 2',system-ui,sans-serif;font-size:18px}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:4px solid #e69531;outline-offset:5px}button:disabled{cursor:default}header{max-width:1120px;margin:auto;padding:26px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:11px;font-size:23px;font-weight:800;line-height:1.15}.brand small{display:block;font-size:11px;letter-spacing:2px;font-weight:600;margin-top:5px}.logo{width:45px;height:45px;background:#dcead9;border-radius:15px;display:grid;place-items:center;font-size:32px}.sound{background:white;border:1px solid #dce4d8;border-radius:100px;padding:9px 17px;font-size:14px;font-weight:700}.shell{max-width:1000px;padding:16px 24px 40px;margin:auto}.eyebrow{display:inline-block;background:#e7eddd;padding:6px 14px;border-radius:30px;font-size:12px;letter-spacing:1.7px;font-weight:700}.intro{text-align:center}.intro h1{font-size:clamp(36px,5vw,56px);line-height:1.13;letter-spacing:-1.5px;margin:18px 0 10px;font-weight:800}.intro h1 span{color:#438366}.intro p{color:#748074;margin:0;font-size:18px}.tabs{display:flex;gap:6px;background:#eaece2;padding:6px;border-radius:18px;max-width:600px;margin:27px auto 24px}.tab{flex:1;border:0;background:transparent;padding:12px 8px;border-radius:13px;font-size:16px;color:#6d7f72;font-weight:700}.tab[aria-selected=true]{background:white;color:var(--green);box-shadow:0 3px 8px #3851370a}.stage{position:relative;background:white;border:1px solid #e5e8dd;border-radius:30px;padding:26px 36px 30px;box-shadow:0 8px 0 #e9ebdf}.stage-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.mini{font-size:12px;font-weight:700;letter-spacing:1.6px;color:#81907c}.pill{background:#faf2da;color:#ad7a28;padding:5px 13px;border-radius:40px;font-size:14px;font-weight:700}h2{font-size:28px;line-height:1.2;margin:16px 0 8px;font-weight:800}.hint{color:#7c887b;font-size:16px;margin:0}.cards{display:grid;grid-template-columns:1fr 1fr;gap:24px;max-width:640px;margin:25px auto}.letter-card{position:relative;min-height:240px;border:2px solid #c4ded2;border-bottom:6px solid #b1d0c0;border-radius:25px;background:#edf6ed;color:#286d56;padding:8px 12px 18px;transition:transform .16s,box-shadow .16s}.letter-card:hover{transform:translateY(-4px);box-shadow:0 8px 16px #2e533410}.letter-card.purple{background:#f1edfa;color:#7e64aa;border-color:#dcd0eb;border-bottom-color:#c9b8df}.arabic{font-family:'Noto Naskh Arabic','Times New Roman',serif;font-weight:600;direction:rtl}.big-letter{font-size:118px;line-height:1.4;display:block;height:158px}.card-name{display:block;font-weight:800;font-size:23px;line-height:1.2}.card-note{display:block;font-size:14px;opacity:.8;margin-top:6px}.speaker{position:absolute;right:14px;top:12px;font-size:17px}.tip{display:flex;gap:14px;align-items:center;max-width:640px;background:#faf6e7;border:1px dashed #dfd4a9;border-radius:16px;margin:18px auto 0;padding:14px 20px;text-align:left;font-size:15px;line-height:1.5}.tip-icon{font-size:30px}.primary{background:var(--green);border:0;border-bottom:4px solid #1d573f;border-radius:14px;padding:12px 25px;color:white;font-weight:700;font-size:18px}.primary:hover{background:#22674f}.primary:active{transform:translateY(2px)}.secondary{border:1px solid #d7e0d0;border-radius:12px;background:#f6f8f1;color:var(--green);padding:9px 18px;font-weight:700}.foot{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:24px}.sound-toggle{display:flex;align-items:center;gap:8px;font-size:14px}.switch{background:#edf2e7;border:1px solid #d4dfcc;border-radius:10px;padding:8px 13px;color:#48704d;font-weight:700}.switch[aria-pressed=true]{background:#dcebd6;border-color:#94bb7b}.footer{text-align:center;color:#8e9884;font-size:13px;margin-top:25px}.progress{display:flex;gap:8px;justify-content:center;margin:18px 0}.star{font-size:28px;color:#dedfd4}.star.earned{color:#e9ad3f}.feedback{min-height:31px;font-weight:700;text-align:center;color:#397558}.next-wrap{text-align:center;min-height:56px}.correct{outline:4px solid #5b9c6d;outline-offset:4px}.wiggle{animation:wiggle .3s}.dots-area{position:relative;width:280px;height:240px;margin:15px auto 0}.dot-slots{display:flex;gap:12px;justify-content:center;padding-top:14px}.dot-slot{height:32px;width:32px;border:2px dashed #aa93c9;border-radius:50%;background:#f6f0ff;color:transparent}.dot-slot.filled{background:#8061a5;border-style:solid;color:white}.dots-base{font-size:155px;line-height:1;position:absolute;top:63px;left:0;width:100%;text-align:center;color:#8061a5}.fatha-example{font-size:34px;line-height:1}.celebrate{font-size:62px;margin:16px 0 0}.complete{padding:5px 0 24px;text-align:center}.hidden{display:none!important}.decoration{position:fixed;z-index:-1;color:#dce5ce;font-size:80px;bottom:6%;left:4%;transform:rotate(-20deg)}.decoration.right{left:auto;right:4%;bottom:15%;font-size:55px;color:#e6dfca;transform:rotate(15deg)}@keyframes wiggle{25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}@media(max-width:600px){header{padding:20px}.brand{font-size:20px}.brand small{font-size:9px}.sound{padding:8px 11px}.shell{padding:10px 16px 30px}.intro h1{font-size:37px}.intro p{font-size:16px}.stage{padding:20px 16px;border-radius:24px}.tab{font-size:13px;padding:11px 4px}.cards{gap:12px;margin:22px auto}.letter-card{min-height:215px}.big-letter{font-size:99px;height:140px}.card-name{font-size:20px}.foot{flex-direction:column}.primary{width:100%}.tip{padding:12px;font-size:13px}.stage-head{font-size:11px}.mini{font-size:10px}.pill{font-size:12px}h2{font-size:25px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="decoration" aria-hidden="true">✳</div><div class="decoration right" aria-hidden="true">✦</div>
<header><a class="brand" href="./" style="text-decoration:none;color:inherit"><span class="logo" aria-hidden="true">❧</span><span>Seen & Sheen<small>LITTLE LETTER GARDEN</small></span></a><button id="sound" class="sound" aria-pressed="true">♫ Sound on</button></header>
<main class="shell">
<section class="intro"><span class="eyebrow">A LITTLE PLAY. A LITTLE ARABIC.</span><h1>Little letters.<br><span>Big adventures.</span></h1><p>Meet two new friends. Let’s learn, play, and grow!</p></section>
<nav class="tabs" role="tablist" aria-label="Letter activities"><button class="tab" id="tab-learn" role="tab" aria-selected="true" aria-controls="panel" data-mode="learn">① Meet the letters</button><button class="tab" id="tab-play" role="tab" aria-selected="false" aria-controls="panel" data-mode="play">② Find a friend</button><button class="tab" id="tab-dots" role="tab" aria-selected="false" aria-controls="panel" data-mode="dots">③ Make Sheen</button></nav>
<section class="stage" id="panel" role="tabpanel" aria-labelledby="tab-learn"></section>
<p class="footer">Made for little explorers · No timers. Just happy learning. 🌱</p>
</main>
<script>
const $=s=>document.querySelector(s);
const letters=[{char:'س',fatha:'سَ',name:'Seen',sound:'sa',arabicName:'سِين',note:'No dots. Just a smile!',color:''},{char:'ش',fatha:'شَ',name:'Sheen',sound:'sha',arabicName:'شِين',note:'Three dots on top!',color:'purple'}];
let mode='learn',withFatha=false,soundOn=true,round=0,answered=false,dots=0,deck=[],audioContext;
let best=0;try{best=Number(localStorage.getItem('seen-sheen-stars'))||0}catch{}
function tone(){if(!soundOn)return;try{audioContext ||= new(window.AudioContext||window.webkitAudioContext)();audioContext.resume();[523,659,784].forEach((f,i)=>{const o=audioContext.createOscillator(),g=audioContext.createGain();o.connect(g);g.connect(audioContext.destination);o.frequency.value=f;g.gain.setValueAtTime(.07,audioContext.currentTime+i*.12);g.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+i*.12+.22);o.start(audioContext.currentTime+i*.12);o.stop(audioContext.currentTime+i*.12+.23)})}catch{}}
function speak(text,arabic=false){if(!soundOn||!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=arabic?'ar-SA':'en-AU';u.rate=.8;const voices=window.speechSynthesis.getVoices();const voice=voices.find(v=>v.lang.startsWith(arabic?'ar':'en'));if(arabic&&!voice){$('#feedback')&&( $('#feedback').textContent='Say it together: '+(text.includes('ش')?(text.includes('ِ')?'Sheen':'sha'):(text.includes('ِ')?'Seen':'sa'))+'.');return}if(voice)u.voice=voice;window.speechSynthesis.speak(u)}
function hear(i){speak(withFatha?letters[i].fatha:letters[i].arabicName,true)}
function card(i,quiz=false){const l=letters[i];return `<button class="letter-card ${l.color}" data-letter="${i}" aria-label="${withFatha?l.sound:l.name}"><span class="speaker" aria-hidden="true">${quiz?'':'♫'}</span><span class="arabic big-letter" lang="ar">${withFatha?l.fatha:l.char}</span><span class="card-name">${withFatha?l.sound:l.name}</span><span class="card-note">${quiz?'Tap to choose':withFatha?'Fatḥa adds a short “a”':l.note}</span></button>`}
function top(label){return `<div class="stage-head"><span class="mini">${label}</span><span class="pill">★ ${best===6?'Letter explorer':'Let’s grow together'}</span></div>`}
function setMode(next){mode=next;if(mode==='play')startGame();if(mode==='dots')dots=0;document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.mode===mode)));$('#panel').setAttribute('aria-labelledby','tab-'+mode);render()}
function render(){if(mode==='learn')renderLearn();if(mode==='play')renderGame();if(mode==='dots')renderDots()}
function renderLearn(){$('#panel').innerHTML=top('YOUR FIRST TWO LETTERS')+`<div class="text-center" style="text-align:center"><h2>${withFatha?'A little mark. A new sound!':'Say hello to Seen & Sheen'}</h2><p class="hint">${withFatha?'Fatḥa is the little slant above a letter.':'Tap a letter and say its name with me.'}</p></div><div class="cards">${card(0)}${card(1)}</div><div class="tip"><span class="tip-icon" aria-hidden="true">${withFatha?'✦':'💡'}</span><span>${withFatha?'<b>Meet fatḥa!</b> It adds a short “a” sound.<br><span class="arabic fatha-example" lang="ar">سَ</span> = <b>sa</b> &nbsp; · &nbsp; <span class="arabic fatha-example" lang="ar">شَ</span> = <b>sha</b>':'<b>Spot the difference!</b> Seen has no dots.<br>Sheen has three. One, two, three!'}</span></div><p id="feedback" class="feedback" aria-live="polite"></p><div class="foot"><button class="switch" id="fatha" aria-pressed="${withFatha}"><span lang="ar" class="arabic">${withFatha?'سَ':'س'}</span> &nbsp; ${withFatha?'Fatḥa on ✓':'Add fatḥa ◌َ'}</button><button class="primary" id="start">Let’s play <span aria-hidden="true">→</span></button></div>`;document.querySelectorAll('[data-letter]').forEach(b=>b.onclick=()=>hear(+b.dataset.letter));$('#fatha').onclick=()=>{withFatha=!withFatha;renderLearn()};$('#start').onclick=()=>setMode('play')}
function startGame(){round=0;answered=false;deck=[0,1,0,1,0,1].sort(()=>Math.random()-.5)}
function renderGame(){if(round>=6){$('#panel').innerHTML=top('YOU DID IT!')+`<div class="complete"><div class="celebrate" aria-hidden="true">🌟🌱🌟</div><h2>You’re a letter explorer!</h2><p class="hint">Six shiny stars. So much lovely learning!</p><div class="progress" aria-label="6 stars earned">${'⭐'.repeat(6)}</div><p>${withFatha?'سَ = sa &nbsp; • &nbsp; شَ = sha':'س = Seen &nbsp; • &nbsp; ش = Sheen'}</p><button class="primary" id="again">Play again ↻</button><div style="margin-top:14px"><button class="secondary" id="try">${withFatha?'Make Sheen’s dots':'Try with fatḥa →'}</button></div></div>`;$('#again').onclick=()=>setMode('play');$('#try').onclick=()=>{if(withFatha)setMode('dots');else{withFatha=true;setMode('learn')}};return}const target=letters[deck[round]];$('#panel').innerHTML=top(`FIND A FRIEND · ${round+1} OF 6`)+`<div class="progress" aria-label="${round} of 6 stars earned">${Array.from({length:6},(_,i)=>`<span class="star ${i<round?'earned':''}" aria-hidden="true">★</span>`).join('')}</div><div style="text-align:center"><h2>Can you find ${withFatha?'“'+target.sound+'”':target.name}?</h2><button class="secondary" id="listen">♫ Hear it</button></div><div class="cards">${Math.random()>.5?card(0,true)+card(1,true):card(1,true)+card(0,true)}</div><p class="feedback" id="feedback" aria-live="polite">${withFatha?'Look for the little fatḥa above the letter.':'Look closely at the dots!'}</p><div class="next-wrap"><button class="primary hidden" id="next">${round===5?'See my stars ★':'Next friend →'}</button></div>`;$('#listen').onclick=()=>hear(deck[round]);document.querySelectorAll('[data-letter]').forEach(b=>b.onclick=()=>{if(answered)return;if(+b.dataset.letter===deck[round]){answered=true;b.classList.add('correct');$('#feedback').textContent='You found it! A star for you! ⭐';document.querySelectorAll('[data-letter]').forEach(x=>x.disabled=true);$('#next').classList.remove('hidden');tone();$('#next').focus()}else{$('#feedback').textContent=deck[round]===0?'Have another go! Seen has no dots.':'Have another go! Sheen has three dots.';b.classList.remove('wiggle');void b.offsetWidth;b.classList.add('wiggle');speak('Have another go!')}});$('#next').onclick=()=>{round++;answered=false;if(round===6){best=6;try{localStorage.setItem('seen-sheen-stars','6')}catch{}tone()}renderGame()}}
function renderDots(){$('#panel').innerHTML=top('A LITTLE DOT MAGIC')+`<div style="text-align:center"><h2>Let’s make Sheen!</h2><p class="hint">Tap each circle to add a dot. We need three!</p><div class="dots-area"><div class="dot-slots">${[0,1,2].map(i=>`<button class="dot-slot" data-dot="${i}" aria-label="Add dot ${i+1}" aria-pressed="false"></button>`).join('')}</div><div class="arabic dots-base" lang="ar" aria-label="Seen">س</div></div><p id="feedback" class="feedback" aria-live="polite">0 of 3 dots. You can do it!</p><div class="tip"><span class="tip-icon" aria-hidden="true">🌱</span><span><b>Same shape, three new dots.</b><br>That’s how Seen becomes Sheen!</span></div><button class="primary hidden" id="dots-next" style="margin-top:22px">Now add fatḥa →</button></div>`;document.querySelectorAll('[data-dot]').forEach(b=>b.onclick=()=>{if(b.getAttribute('aria-pressed')==='true')return;b.setAttribute('aria-pressed','true');b.classList.add('filled');b.textContent='✓';b.disabled=true;dots++;$('#feedback').textContent=`${dots} of 3 dots. ${dots===3?'You made Sheen! ⭐':'Keep going!'}`;if(dots===3){$('.dots-area').innerHTML='<span class="arabic big-letter" lang="ar" style="font-size:150px;height:240px;color:#8061a5">ش</span>';$('#dots-next').classList.remove('hidden');tone();$('#dots-next').focus()}});$('#dots-next').onclick=()=>{withFatha=true;setMode('learn')}}
$('#sound').onclick=()=>{soundOn=!soundOn;$('#sound').textContent=soundOn?'♫ Sound on':'♫ Sound off';$('#sound').setAttribute('aria-pressed',String(soundOn));if(!soundOn&&'speechSynthesis'in window)window.speechSynthesis.cancel()};document.querySelectorAll('.tab').forEach((b,i)=>{b.onclick=()=>setMode(b.dataset.mode);b.onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const tabs=[...document.querySelectorAll('.tab')];const n=e.key==='Home'?0:e.key==='End'?2:(i+(e.key==='ArrowRight'?1:2))%3;tabs[n].focus();setMode(tabs[n].dataset.mode)}}});render();
</script>
</body>
</html>
